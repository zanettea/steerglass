[package]
name = "steerglass-tui"
version = "0.5.2"
description = "Steerglass TUI - fast multi-cluster Kubernetes terminal client"
authors = ["Davide Bettio"]
license = "Apache-2.0"
edition = "2024"

[[bin]]
name = "steerglass-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
kube = { version = "4.2.0", default-features = false, features = ["runtime", "ws", "client", "rustls-tls", "ring", "gzip"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
tokio = { version = "1.54.1", features = ["full"] }
futures = "0.3.34"
thiserror = "2.0.21"
dirs = "7.0.0"
parking_lot = "0.12.5"
chrono = "0.4.45"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.23.1"
http = "1"
regex = "1"
arboard = "3"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"

[dev-dependencies]
flate2 = "1.1"
